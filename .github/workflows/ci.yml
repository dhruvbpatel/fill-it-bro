name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      py: ${{ steps.filter.outputs.py }}
      fixture: ${{ steps.filter.outputs.fixture }}
      exe: ${{ steps.filter.outputs.exe }}
      service-image: ${{ steps.filter.outputs.service-image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'packages/**'
              - 'apps/desktop/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.prettierrc'
              - '.github/workflows/ci.yml'
            py:
              - 'apps/service/**'
              - 'evals/harness/**'
              - 'packages/contracts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
            fixture:
              - 'apps/fixture-form/**'
              - 'configs/**'
              - '.github/workflows/ci.yml'
            exe:
              - 'apps/desktop/**'
              - 'packages/ingest/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            service-image:
              - 'apps/service/**'
              - 'uv.lock'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fib/driver-playwright exec playwright install --with-deps chromium
      - name: contracts:gen idempotency check
        run: |
          pnpm contracts:gen
          git diff --exit-code
      - run: pnpm build
      - run: pnpm lint
      # apps/desktop launches real Electron windows (unlike headless Chromium), which need
      # an X display even with --no-sandbox; ubuntu-latest runners have none by default.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # --workspace-concurrency=1: packages/driver-playwright and apps/desktop each spin up
      # their own fixture-form dev server via Playwright's webServer, both bound to the same
      # port (from the shared configs/*.json urlTemplate, not package-local) -- running them
      # in parallel races for that port.
      - run: xvfb-run --auto-servernum -- pnpm --filter '!fixture-form' -r --workspace-concurrency=1 test

  py:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'
      - run: uv sync
      - run: uv run ruff check apps/service evals/harness
      - run: uv run pytest

  fixture:
    needs: changes
    if: needs.changes.outputs.fixture == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fixture-form exec playwright install --with-deps chromium
      - run: pnpm --filter fixture-form build
      - run: pnpm --filter fixture-form test

  # Ticket 28: portable Windows EXE artifact + smoke launch.
  build-exe:
    needs: changes
    if: needs.changes.outputs.exe == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter desktop package
      - name: Verify bundled configs (AC: resources/configs/forms/fixtureDeal/form.json)
        shell: bash
        run: test -f apps/desktop/release/win-unpacked/resources/configs/forms/fixtureDeal/form.json
      - name: Smoke the portable EXE (AC: --smoke exits 0)
        shell: pwsh
        env:
          FIB_SMOKE_TIMEOUT_MS: '60000'
        run: |
          $exe = (Get-ChildItem "apps/desktop/release/fill-it-bro-*.exe" | Select-Object -First 1).FullName
          Write-Host "smoke: $exe"
          & $exe --dealId=1 --formId=fixtureDeal --smoke
          exit $LASTEXITCODE
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: fill-it-bro-exe
          path: apps/desktop/release/fill-it-bro-*.exe
          if-no-files-found: error

  # Ticket 28: service container image; pushed to ${{ vars.REGISTRY }} on main only.
  deploy-service:
    needs: changes
    if: needs.changes.outputs.service-image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/service/Dockerfile -t fill-it-bro-service:ci .
      - name: Check /healthz inside the container (AC)
        run: |
          docker run -d --name fib-service -p 8787:8787 fill-it-bro-service:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8787/healthz; then
              echo ""
              echo "healthz ok"
              docker rm -f fib-service > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "healthz never responded; container logs:"
          docker logs fib-service
          docker rm -f fib-service > /dev/null
          exit 1
      - name: Log in to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ vars.REGISTRY }}/fill-it-bro-service:${{ github.sha }}"
          docker tag fill-it-bro-service:ci "$IMAGE"
          docker push "$IMAGE"
