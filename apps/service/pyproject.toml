[project]
name = "fib_service"
version = "0.0.0"
description = "Fill-It-Bro extraction and fallback-agent service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.52",
  "pydantic>=2.9",
  "openai>=3.8",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fib_service"]
