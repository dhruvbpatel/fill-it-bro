[tool.uv.workspace]
members = ["apps/service", "evals/harness"]

[tool.pytest.ini_options]
testpaths = ["apps/service/tests", "evals/harness/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
# Generated by packages/contracts/scripts/gen.ts; never hand-edited.
extend-exclude = ["apps/service/src/fib_service/contracts"]
